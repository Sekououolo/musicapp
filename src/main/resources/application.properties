# ===== BASE DE DONNEES MYSQL (XAMPP) =====
spring.datasource.url=jdbc:mysql://localhost:3306/musicapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== SERVEUR =====
server.port=8080
spring.application.name=musicapp

# ===== STOCKAGE FICHIERS MP3 =====
app.upload.dir=uploads/mp3
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
